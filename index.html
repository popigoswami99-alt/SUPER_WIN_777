function tick(){let left=30-Math.floor((Date.now()-round)/1000)%30;$('timer').textContent='00:'+String(left).padStart(2,'0');$('roundId').textContent='SW'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14);if(left===30){let n=Math.floor(Math.random()*10);$('balls').innerHTML='<div class="ball '+(n%2?'red':'green')+'">'+n+'</div>';let row=document.createElement('div');row.className='result';row.innerHTML='<span>Round '+n+Date.now().toString().slice(-4)+'</span><b>'+n+'</b>'; $('gameResults').prepend(row);$('latest').prepend(row.cloneNode(true));while($('gameResults').children.length>10)$('gameResults').lastChild.remove();while($('latest').children.length>8)$('latest').lastChild.remove()}} 
money();updateStats();renderExtra();for(let i=0;i<5;i++){let row=document.createElement('div');row.className='result';row.innerHTML='<span>Win Go • '+(1200+i)+'</span><b>'+(Math.floor(Math.random()*10))+'</b>';$('latest').append(row.cloneNode(true));$('gameResults').append(row)}setInterval(tick,250);tick();
async function syncServer(){try{let s=await fetch('/api/state').then(r=>r.json());let chip=document.querySelector('.livechip');if(chip)chip.innerHTML='<i></i>Server '+(s.server==='online'?'Online':'Offline');let pc=document.getElementById('onlineCount');if(pc)pc.textContent=s.onlinePlayers.toLocaleString();}catch(e){}}syncServer();setInterval(syncServer,3000);if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
