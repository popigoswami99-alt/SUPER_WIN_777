<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER WIN 777 Admin</title><style>
body{margin:0;background:#030913;color:#eef5ff;font-family:system-ui;padding:20px}.wrap{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#09182a;border:1px solid #193550;border-radius:14px;padding:15px}.ok{color:#15e39a}.muted{color:#8da2bb}button{padding:10px 13px;border:1px solid #244967;background:#0c2137;color:#fff;border-radius:9px;margin:3px}h1{color:#ffd447}</style></head><body><div class="wrap"><h1>SUPER WIN 777 — Admin</h1><p class="muted">Free-play administration • cash systems disabled</p><div class="grid"><div class="card"><b>Server</b><h2 class="ok" id="server">Checking…</h2><span class="muted">Automatic round engine</span></div><div class="card"><b>Cash Systems</b><h2>🔒 OFF</h2><span class="muted">Deposit / withdrawal / payout unavailable</span></div><div class="card"><b>Current Round</b><h2 id="round">—</h2><span class="muted" id="timer">—</span></div><div class="card"><b>Online Players</b><h2 id="players">—</h2><span class="muted">Simulated live counter</span></div></div><h2>Controls</h2><div class="card"><button onclick="toast('Daily virtual rewards refreshed')">Refresh Rewards</button><button onclick="toast('Notifications broadcast to demo clients')">Broadcast Notification</button><button onclick="toast('Leaderboard recalculated')">Recalculate Leaderboard</button><button onclick="toast('Game configuration saved')">Save Game Settings</button></div><p id="msg" class="muted"></p></div><script>
async function load(){let s=await fetch("/api/state").then(r=>r.json());server.textContent="ONLINE";round.textContent=s.round.id;timer.textContent=s.round.secondsLeft+" sec";players.textContent=s.onlinePlayers.toLocaleString()}function toast(x){msg.textContent="✓ "+x;setTimeout(()=>msg.textContent="",1800)}load();setInterval(load,1000)</script></body></html>
